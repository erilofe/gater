repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files

    # - repo: https://github.com/golangci/golangci-lint
    #   rev: v2.8.0
    #   hooks:
    #     - id: golangci-lint

    - repo: local
      hooks:
          - id: golangci-lint
            name: golangci-lint
            entry: golangci-lint run --allow-parallel-runners --config=.golangci.yml
            language: system
            types: [go]
            pass_filenames: false

    - repo: local
      hooks:
          - id: go-test
            name: Run Go Tests
            entry: go test ./...
            language: system
            types: [go]
            pass_filenames: false
