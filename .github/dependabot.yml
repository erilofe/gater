version: 2

updates:
    # Go dependencies
    - package-ecosystem: "gomod"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "go"
      commit-message:
          prefix: "chore(deps)"
          include: "scope"
      groups:
          go-dependencies:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    # GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 3
      labels:
          - "dependencies"
          - "github-actions"
      commit-message:
          prefix: "chore(ci)"
          include: "scope"

    # Docker
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      labels:
          - "dependencies"
          - "docker"
      commit-message:
          prefix: "chore(docker)"
