run:
  timeout: 5m
  tests: false

linters:
  disable-all: true
  enable:
    - gofmt
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - typecheck
    - unused
    - misspell
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/pietroagazzi/gater

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
